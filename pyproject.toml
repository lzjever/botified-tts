[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "botified-tts"
version = "0.2.2"
description = "Independent Botified TTS service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3%2Bcu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl",
  "huggingface-hub==1.25.1",
  "llvmlite==0.48.0",
  "modelscope-hub==0.1.8",
  "nano-vllm-voxcpm",
  "numba==0.66.0",
  "numpy==2.4.6",
  "python-multipart==0.0.20",
  "starlette==0.47.2",
  "torch==2.9.0",
  "torchaudio==2.9.0",
  "transformers==5.14.1",
  "uvicorn==0.35.0",
  "websockets==15.0.1",
]

[project.scripts]
botified-tts = "botified_tts.runtime:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/botified_tts"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
nano-vllm-voxcpm = { git = "https://github.com/lzjever/nanovllm-voxcpm.git", rev = "1ff870f8dd103a2d50aa9a68604a2d55fe5b4c60" }
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
