[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "botified-tts"
version = "0.0.0"
description = "Independent Botified TTS service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.4.6",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/botified_tts"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
