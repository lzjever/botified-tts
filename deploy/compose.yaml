name: botified-tts

services:
  tts:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: on-failure
    environment:
      BOTIFIED_TTS_HOST: "0.0.0.0"
      BOTIFIED_TTS_PORT: "8000"
      BOTIFIED_TTS_MODEL: "openbmb/VoxCPM2"
      BOTIFIED_TTS_MODEL_REVISION: "bffb3df5a29440629464e5e839f4d214c8714c3d"
      BOTIFIED_TTS_GPU_DEVICE: "0"
      BOTIFIED_TTS_DATA_DIR: "/data"
      BOTIFIED_TTS_API_KEY: "${BOTIFIED_TTS_API_KEY:?BOTIFIED_TTS_API_KEY is required}"
      BOTIFIED_TTS_LOG_LEVEL: "INFO"
    ports:
      - "${PUBLISHED_PORT:-8000}:8000"
    volumes:
      - botified-tts-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${HOST_GPU:-0}"
              capabilities:
                - gpu

volumes:
  botified-tts-data:
