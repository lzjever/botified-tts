[project]
name = "botified-tts-sidecar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
