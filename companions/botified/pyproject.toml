[project]
name = "botified-tts-companion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "websockets>=15,<16",
]

[project.scripts]
botified-tts-companion = "botified_tts_companion.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
